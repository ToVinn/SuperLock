services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./resources/views:/var/www/html/resources/views
      - ./public:/var/www/html/public
      - ./routes:/var/www/html/routes
      - ./app:/var/www/html/app
      - ./database:/var/www/html/database
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: penitipan_hp
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_KEY: base64:By8KpAqeB7SVunxORKg3M+sQ1anVmBKIJ96NF7JruIs=
      LOG_LEVEL: error
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: penitipan_hp
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_DB: penitipan_hp
    depends_on:
      - db

volumes:
  dbdata:
